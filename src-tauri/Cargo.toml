[package]
name = "screen-gole"
version = "0.2.1"
description = "Screen Gole desktop client"
authors = ["Screen Gole"]
edition = "2021"

[lib]
name = "screen_gole_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.24"
windows-capture = "2.0.1"
sysinfo = "0.38"
